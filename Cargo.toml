[workspace]
resolver = "3"
members = ["crates/rpm-health-core", "crates/rpm-health-cli"]

# Settings shared by every crate in the workspace. Each crate opts in with
# `version.workspace = true` and so on.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The licence gets chosen in Milestone 5. Until then, nothing can be published
# to crates.io by accident.
publish = false

# Versions follow what Fedora 45 ships, so Milestone 6 packaging is easier.
[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
comfy-table = "~7.1"
quick-xml = "0.42"
# blocking: no async runtime in our code. native-tls: use the system's OpenSSL,
# which is what Fedora expects, instead of bundling a TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Date parsing, formatting and arithmetic, which is too easy to get subtly wrong
# by hand. Only the features we use are enabled.
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "serde-human-readable"] }

rpm-health-core = { path = "crates/rpm-health-core" }
