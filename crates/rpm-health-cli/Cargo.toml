[package]
name = "rpm-health-cli"
description = "Command-line front-end for rpm-health"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The package is rpm-health-cli, but the command people type is rpm-health.
[[bin]]
name = "rpm-health"
path = "src/main.rs"

[dependencies]
rpm-health-core.workspace = true
clap.workspace = true
comfy-table.workspace = true
serde.workspace = true
serde_json.workspace = true
